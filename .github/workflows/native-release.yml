name: Native release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to build native wheels for (e.g. v0.1.3)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  wheels:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc wheels — cover Fedora, Ubuntu, Debian, Alpine
          # with glibc, plus RHEL and Amazon Linux.
          - target: x86_64-unknown-linux-gnu
            args: --release --out dist
          - target: aarch64-unknown-linux-gnu
            args: --release --out dist
          - target: x86_64-unknown-linux-musl
            args: --release --out dist
          - target: aarch64-unknown-linux-musl
            args: --release --out dist
          # macOS — both Intel and Apple Silicon.
          - target: x86_64-apple-darwin
            args: --release --out dist
          - target: aarch64-apple-darwin
            args: --release --out dist
          # Windows.
          - target: x86_64-pc-windows-msvc
            args: --release --out dist
          - target: aarch64-pc-windows-msvc
            args: --release --out dist
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}
          working-directory: native
          sccache: "true"
          rust-toolchain: stable
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            native/dist/*.whl
          if-no-files-found: error

  attach:
    name: Attach to GitHub release
    needs: wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: native-dist
      - name: Flatten
        run: |
          mkdir -p native-flat
          find native-dist -type f -name '*.whl' -exec cp {} native-flat/ \;
          ls -la native-flat
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: native-flat/*.whl
