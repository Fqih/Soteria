name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/avo
      - name: Bandit
        run: bandit -r src/avo -c pyproject.toml --severity-level medium
      - name: pip-audit
        run: pip-audit --strict
      - name: Tests
        run: pytest
      - name: Build
        env:
          # Reproducible build: pin build timestamp to the latest
          # commit so wheel and sdist are byte-identical between runs.
          SOURCE_DATE_EPOCH: ${{ format('{0}', github.event.repository.updated_at_timestamp) }}
        run: |
          # GitHub's ``github.event.repository.updated_at_timestamp`` is
          # not always present; fall back to ``git log -1`` so the
          # build is reproducible locally too.
          if [ -z "${SOURCE_DATE_EPOCH:-}" ]; then
            SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          fi
          export SOURCE_DATE_EPOCH
          python -m build
