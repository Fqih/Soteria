[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "avo"
version = "0.1.1"
description = "Reliable execution infrastructure for long-running AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "FaqihHakim" },
]
keywords = ["agents", "ai", "reliability", "sqlite", "runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "hatchling>=1.26",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]
live-benchmark = [
  "httpx>=0.27",
  "matplotlib>=3.8",
]
providers = [
  "httpx>=0.27",
]
sandbox = [
  "docker>=7.0",
]
mcp = [
  # MCP servers are launched as subprocesses that speak JSON-RPC over stdio.
  # Avo itself does not depend on the upstream `mcp` SDK — it ships a
  # minimal JSON-RPC client. Install this extra only when you want the
  # richer SDK helpers (server authoring, transports beyond stdio).
  "mcp>=1.0",
]

[project.scripts]
avo = "avo.cli:main"

[project.urls]
Homepage = "https://github.com/Fqih/avo"
Repository = "https://github.com/Fqih/avo"
Issues = "https://github.com/Fqih/avo/issues"

[project.entry-points.pytest11]
avo-live = "avo._pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/avo"]

[tool.pytest.ini_options]
# Skip the live integration tests by default so the offline suite stays
# free of paid API traffic. Run them with `pytest --run-live tests/integration`.
addopts = "--strict-config --strict-markers --ignore=tests/integration"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: opt-in tests that hit real HTTP endpoints; require --run-live",
]

[tool.coverage.run]
branch = true
source = ["avo"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ASYNC",
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201"]
"benchmark/*.py" = ["T201"]
"src/avo/mcp_servers/*.py" = ["ASYNC109", "ASYNC210"]
"tests/test_mcp_servers.py" = ["ASYNC221"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["avo"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
