[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "soteria"
version = "0.1.0"
description = "Reliable execution infrastructure for long-running AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "FaqihHakim" },
]
keywords = ["agents", "ai", "reliability", "sqlite", "runtime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "hatchling>=1.26",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]
live-benchmark = [
  "httpx>=0.27",
  "matplotlib>=3.8",
]

[project.scripts]
soteria = "soteria.cli:main"

[project.urls]
Homepage = "https://github.com/faqihhakim/soteria"
Repository = "https://github.com/faqihhakim/soteria"
Issues = "https://github.com/faqihhakim/soteria/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/soteria"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["soteria"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ASYNC",
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201"]
"benchmark/*.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["soteria"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
